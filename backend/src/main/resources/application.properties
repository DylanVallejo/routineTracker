spring.application.name=routine-tracker-backend
server.port=8080

# Archivo local, no versionado (ver .gitignore), para credenciales reales en desarrollo
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/routine_tracker_db?createDatabaseIfNotExist=true&serverTimezone=America/Guayaquil}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1yb3V0aW5lLXRyYWNrZXItY2FtYmlhci1lbi1wcm9kdWNjaW9uLTEyMzQ1Ng==}
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Routine Tracker <noreply@routinetracker>}

app.token.verificacion-horas=24
app.token.recuperacion-minutos=30
app.token.cooldown-segundos=60
app.token.max-por-ventana=3
app.token.ventana-minutos=15
