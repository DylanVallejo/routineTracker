spring.application.name=routine-tracker-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/routine_tracker_db?createDatabaseIfNotExist=true&serverTimezone=America/Guayaquil
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1yb3V0aW5lLXRyYWNrZXItY2FtYmlhci1lbi1wcm9kdWNjaW9uLTEyMzQ1Ng==}
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=http://localhost:5173
